[html_loader]
title = HTML Loader
help = Settings for HTML Loader extension

fix_canvas_bottom_gap.type = bool
fix_canvas_bottom_gap.default = 1
fix_canvas_bottom_gap.label = Fix Canvas Bottom Gap
fix_canvas_bottom_gap.help = Fill the game area in Stretch mode when both Defold footer controls are hidden.

background_size.type = string
background_size.help = CSS size of the splash image, such as 50% or contain.

background_color.type = string
background_color.help = CSS background color behind the splash image.

loader_main_color.type = string
loader_main_color.default = rgba(26, 114, 235, 1)
loader_main_color.help = Main color for the loading spinner, progress bar, and progress text.

loader_additional_color.type = string
loader_additional_color.default = rgba(26, 114, 235, 0.2)
loader_additional_color.help = Accent color for the loading spinner and the progress bar track.

loader_frame_color.type = string
loader_frame_color.default = rgba(255, 255, 255, 1)
loader_frame_color.help = Background color of the frame around the progress text.
